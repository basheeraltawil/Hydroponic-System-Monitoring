<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hydroponic System Dashboard</title>
  <link rel="stylesheet" href="style.css" />
  <!-- Load React + Babel -->
  <script src="https://cdn.jsdelivr.net/npm/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://cdn.jsdelivr.net/npm/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <script src="https://cdn.jsdelivr.net/npm/@babel/standalone@7/babel.min.js"></script>
  <!-- Load Chart.js for data visualization -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
  <div id="root"></div>
  
  <!-- Fallback content in case React doesn't load -->
  <div id="fallback" style="display: none;">
    <!-- This will be populated by JavaScript -->
  </div>

  <script type="text/babel" src="app.js"></script>
  
  <!-- Fallback JavaScript -->
  <script>
    let isLoggedIn = false;
    let currentUsername = '';
    
    function showLoginScreen() {
      document.getElementById('fallback').innerHTML = `
        <div class="login-container">
          <div class="login-form">
            <h1>🌱 Hydroponic System Dashboard</h1>
            <h2>System Login</h2>
            <form onsubmit="handleLogin(event)">
              <div class="form-group">
                <label>Username:</label>
                <input type="text" value="admin" class="form-input" required />
              </div>
              <div class="form-group">
                <label>Password:</label>
                <input type="password" value="admin" class="form-input" required />
              </div>
              <button type="submit" class="login-button">Login</button>
            </form>
            <p class="login-note">Default: admin / admin</p>
          </div>
        </div>
      `;
    }
    
    window.handleLogin = function(event) {
      event.preventDefault();
      const usernameInput = event.target.querySelector('input[type="text"]');
      currentUsername = usernameInput.value || 'admin';
      isLoggedIn = true;
      initMainDashboard();
    }
    
    window.handleLogout = function() {
      isLoggedIn = false;
      currentUsername = '';
      activeTab = 'dashboard';
      showLoginScreen();
    }

    function getSelectedDevice() {
      return devices.find(device => device.id === selectedDevice) || devices[0];
    }
    
    function initMainDashboard() {
      document.getElementById('fallback').innerHTML = `
        <div class="dashboard">
          <header class="dashboard-header">
            <h1>🌱 Hydroponic System Dashboard</h1>
            <div class="header-controls">
              <nav class="tab-navigation">
                <button class="tab-button active" onclick="switchTab('dashboard')">📊 Dashboard</button>
                <button class="tab-button" onclick="switchTab('devices')">🔧 Devices</button>
                <button class="tab-button" onclick="switchTab('profiles')">👤 Profiles</button>
              </nav>
              <div class="header-right-info">
                <div class="username-display" id="fallback-username">Loading...</div>
                <div class="last-update" id="fallback-time">Last updated: Loading...</div>
              </div>
            </div>
          </header>
          <main class="dashboard-main"></main>
          <footer class="dashboard-footer">
            <p>Raspberry Pi Hydroponic Monitoring System</p>
          </footer>
        </div>
      `;
      updateHeader();
      updateDashboard();
      startDataUpdates();
    }
    
    // Check if React loaded, if not show fallback
    setTimeout(() => {
      if (typeof React === 'undefined' || document.getElementById('root').innerHTML === '') {
        document.getElementById('fallback').style.display = 'block';
        initFallbackDashboard();
      }
    }, 2000);
    
    function initFallbackDashboard() {
      if (!isLoggedIn) {
        showLoginScreen();
        return;
      }
      
      initMainDashboard();
    }
    
    // Device-specific sensor data
    let deviceSensorData = {
      1: { // Greenhouse Alpha
        temperature: 22.5,
        humidity: 65,
        electricConductivity: 1200,
        waterLevel: 85,
        pH: 6.2,
        lightIntensity: 75,
        nutrientLevel: 90,
        airTemperature: 24.1
      },
      2: { // Greenhouse Beta
        temperature: 20.8,
        humidity: 58,
        electricConductivity: 1350,
        waterLevel: 72,
        pH: 6.5,
        lightIntensity: 68,
        nutrientLevel: 85,
        airTemperature: 22.9
      }
    };
    
    // Get current device sensor data
    function getCurrentSensorData() {
      return deviceSensorData[selectedDevice] || deviceSensorData[1];
    }
    
    // Store devices and profiles
    let devices = [
      {
        id: 1,
        name: 'Greenhouse Alpha',
        type: 'Hydroponic Controller',
        location: 'Sector A',
        serial: 'HY-RPI-001',
        firmware: '1.2.3',
        profile: 'lettuce-optimal',
        status: 'online',
        lastSeen: new Date('2025-08-09T09:56:05'),
        createdAt: new Date('2025-08-01T10:00:00')
      },
      {
        id: 2,
        name: 'Greenhouse Beta',
        type: 'Hydroponic Controller',
        location: 'Sector B',
        serial: 'HY-RPI-002',
        firmware: '1.2.1',
        profile: 'tomato-growth',
        status: 'offline',
        lastSeen: new Date('2025-08-09T08:56:05'),
        createdAt: new Date('2025-08-01T11:00:00')
      }
    ];
    let profiles = [];
    let activeTab = 'dashboard';
    let selectedDevice = 1; // Default to first device
    
    // Store historical data per device
    let historicalData = {};
    
    // Initialize historical data for each device
    devices.forEach(device => {
      historicalData[device.id] = {};
      Object.keys(deviceSensorData[device.id] || {}).forEach(key => {
        historicalData[device.id][key] = [];
      });
    });
    
    const sensors = [
      { key: 'temperature', title: 'Water Temperature', unit: '°C', icon: '🌡️' },
      { key: 'humidity', title: 'Humidity', unit: '%', icon: '💧' },
      { key: 'electricConductivity', title: 'Electric Conductivity', unit: 'μS/cm', icon: '⚡' },
      { key: 'waterLevel', title: 'Water Level', unit: '%', icon: '🌊' },
      { key: 'pH', title: 'pH Level', unit: '', icon: '🧪' },
      { key: 'lightIntensity', title: 'Light Intensity', unit: '%', icon: '☀️' },
      { key: 'nutrientLevel', title: 'Nutrient Level', unit: '%', icon: '🥬' },
      { key: 'airTemperature', title: 'Air Temperature', unit: '°C', icon: '🌡️' }
    ];
    
    function getStatusColor(sensorType, value) {
      const ranges = {
        temperature: { optimal: [20, 26], warning: [18, 28] },
        humidity: { optimal: [60, 70], warning: [50, 80] },
        electricConductivity: { optimal: [1000, 1400], warning: [800, 1600] },
        waterLevel: { optimal: [70, 100], warning: [40, 100] },
        pH: { optimal: [6.0, 6.8], warning: [5.5, 7.5] },
        lightIntensity: { optimal: [60, 85], warning: [40, 100] },
        nutrientLevel: { optimal: [80, 100], warning: [60, 100] },
        airTemperature: { optimal: [22, 26], warning: [20, 30] }
      };

      const range = ranges[sensorType];
      if (value >= range.optimal[0] && value <= range.optimal[1]) return 'optimal';
      if (value >= range.warning[0] && value <= range.warning[1]) return 'warning';
      return 'critical';
    }
    
    function updateHeader() {
      const header = document.querySelector('.dashboard-header');
      if (header) {
        header.innerHTML = `
          <h1>🌱 Hydroponic System Dashboard</h1>
          <div class="header-controls">
            <nav class="tab-navigation">
              <button class="tab-button ${activeTab === 'dashboard' ? 'active' : ''}" onclick="switchTab('dashboard')">
                📊 Dashboard
              </button>
              <button class="tab-button ${activeTab === 'charts' ? 'active' : ''}" onclick="switchTab('charts')">
                📈 Charts
              </button>
              <button class="tab-button ${activeTab === 'devices' ? 'active' : ''}" onclick="switchTab('devices')">
                🔧 Devices
              </button>
              <button class="tab-button ${activeTab === 'profiles' ? 'active' : ''}" onclick="switchTab('profiles')">
                👤 Profiles
              </button>
            </nav>
            <div class="header-right-info">
              <div class="username-display" id="fallback-username">
                ${currentUsername}
              </div>
              <button class="logout-button" onclick="handleLogout()">
                🚪 Logout
              </button>
              <div class="last-update" id="fallback-time">
                Last updated: ${new Date().toLocaleTimeString()}
              </div>
            </div>
          </div>
        `;
      }
    }
    
    function updateDashboard() {
      const main = document.querySelector('.dashboard-main');
      if (!main) return;
      
      if (activeTab === 'dashboard') {
        main.innerHTML = `
          <div class="dashboard-content">
            <div class="dashboard-actions">
              <div class="device-selector">
                <label>Device:</label>
                <select onchange="selectDevice(this.value)" class="control-select">
                  ${devices.map(device => `
                    <option value="${device.id}" ${device.id === selectedDevice ? 'selected' : ''}>
                      ${device.name} (${device.status})
                    </option>
                  `).join('')}
                </select>
              </div>
              <button class="action-button export-btn" onclick="exportToCSV()">
                💾 Export CSV
              </button>
            </div>
            <div class="selected-device-info">
              <h3>📍 ${getSelectedDevice()?.name || 'No Device Selected'}</h3>
              <p>Location: ${getSelectedDevice()?.location} | Status: <span class="status-text ${getSelectedDevice()?.status}">${getSelectedDevice()?.status}</span></p>
            </div>
            <div class="sensors-grid" id="fallback-grid"></div>
          </div>
        `;
        
        const grid = document.getElementById('fallback-grid');
        grid.innerHTML = '';
        
        sensors.forEach(sensor => {
          const currentData = getCurrentSensorData();
          const value = currentData[sensor.key];
          const status = getStatusColor(sensor.key, value);
          const displayValue = typeof value === 'number' ? value.toFixed(1) : value;
          const statusText = status === 'optimal' ? '✓ Good' : status === 'warning' ? '⚠ Warning' : '⚡ Critical';
          
          const card = document.createElement('div');
          card.className = `sensor-card ${status}`;
          card.innerHTML = `
            <div class="sensor-icon">${sensor.icon}</div>
            <div class="sensor-info">
              <h3>${sensor.title}</h3>
              <div class="sensor-value">
                ${displayValue}<span class="unit">${sensor.unit}</span>
              </div>
              <div class="status-indicator ${status}">
                ${statusText}
              </div>
            </div>
          `;
          grid.appendChild(card);
        });
      } else if (activeTab === 'charts') {
        main.innerHTML = `
          <div class="charts-content">
            <div class="chart-controls">
              <div class="control-group">
                <label>Device:</label>
                <select onchange="selectDevice(this.value)" class="control-select">
                  ${devices.map(device => `
                    <option value="${device.id}" ${device.id === selectedDevice ? 'selected' : ''}>
                      ${device.name} (${device.status})
                    </option>
                  `).join('')}
                </select>
              </div>
              <div class="control-group">
                <label>Sensor:</label>
                <select id="sensor-select" class="control-select">
                  <option value="temperature">Water Temperature</option>
                  <option value="humidity">Humidity</option>
                  <option value="electricConductivity">Electric Conductivity</option>
                  <option value="waterLevel">Water Level</option>
                  <option value="pH">pH Level</option>
                  <option value="lightIntensity">Light Intensity</option>
                  <option value="nutrientLevel">Nutrient Level</option>
                  <option value="airTemperature">Air Temperature</option>
                </select>
              </div>
              <div class="control-group">
                <label>Period:</label>
                <select id="period-select" class="control-select">
                  <option value="1h">Last Hour</option>
                  <option value="6h">Last 6 Hours</option>
                  <option value="24h">Last 24 Hours</option>
                </select>
              </div>
              <button class="action-button export-btn" onclick="exportToCSV()">
                💾 Export CSV
              </button>
            </div>
            <div class="chart-container">
              <h3>${getSelectedDevice()?.name} - Sensor Data Trends</h3>
              <div class="chart-placeholder">
                <p>📈 Charts functionality would display historical sensor data here.</p>
                <p>For the selected device: <strong>${getSelectedDevice()?.name}</strong></p>
                <p>This would show real-time charts using Chart.js when integrated with actual sensor data.</p>
              </div>
            </div>
          </div>
        `;
      } else if (activeTab === 'devices') {
        main.innerHTML = `
          <div class="management-content">
            <div class="form-section">
              <h3>Device Management</h3>
              <h4>+ Add Device</h4>
              <form class="management-form" onsubmit="addDevice(event)">
                <input type="text" id="device-name" placeholder="Device Name" class="form-input" required>
                <input type="text" id="device-type" placeholder="Device Type" class="form-input" required>
                <input type="text" id="device-location" placeholder="Location" class="form-input" required>
                <button type="submit" class="action-button">Add Device</button>
              </form>
            </div>
            <div class="list-section">
              <div class="devices-grid" id="devices-list">
                ${devices.length === 0 ? '<p class="empty-state">No devices added yet. Add your first device above!</p>' : 
                  devices.map(device => `
                    <div class="device-card">
                      <div class="device-header">
                        <h4>${device.name}</h4>
                        <span class="status-badge ${device.status || 'unknown'}">${device.status || 'unknown'}</span>
                      </div>
                      <div class="device-info">
                        <p><strong>Serial:</strong> ${device.serial || 'N/A'}</p>
                        <p><strong>Location:</strong> ${device.location || 'Unknown'}</p>
                        <p><strong>Firmware:</strong> ${device.firmware || 'Unknown'}</p>
                        <p><strong>Profile:</strong> ${device.profile || 'default'}</p>
                        <p><strong>Last Seen:</strong> ${device.lastSeen ? `${device.lastSeen.toLocaleDateString()}, ${device.lastSeen.toLocaleTimeString()}` : 'Never'}</p>
                      </div>
                      <div class="device-actions">
                        <button class="action-button small">Configure</button>
                        <button class="action-button small">Update Firmware</button>
                      </div>
                    </div>
                  `).join('')}
              </div>
            </div>
          </div>
        `;
      } else if (activeTab === 'profiles') {
        main.innerHTML = `
          <div class="management-content">
            <div class="form-section">
              <h3>Create New Profile</h3>
              <form class="management-form" onsubmit="addProfile(event)">
                <input type="text" id="profile-name" placeholder="Profile Name" class="form-input" required>
                <textarea id="profile-description" placeholder="Profile Description" class="form-textarea" rows="3" required></textarea>
                <textarea id="profile-settings" placeholder="Settings (JSON format)" class="form-textarea" rows="4"></textarea>
                <button type="submit" class="action-button">Create Profile</button>
              </form>
            </div>
            <div class="list-section">
              <h3>Profiles (${profiles.length})</h3>
              <div class="items-grid" id="profiles-list">
                ${profiles.length === 0 ? '<p class="empty-state">No profiles created yet. Create your first profile above!</p>' : 
                  profiles.map(profile => `
                    <div class="item-card">
                      <h4>${profile.name}</h4>
                      <p>${profile.description}</p>
                      ${profile.settings ? `<pre class="settings-preview">${profile.settings}</pre>` : ''}
                      <p><small>Created: ${profile.createdAt.toLocaleDateString()}</small></p>
                    </div>
                  `).join('')}
              </div>
            </div>
          </div>
        `;
      }
    }
    
    // Global functions for forms
    window.switchTab = function(tab) {
      activeTab = tab;
      updateHeader();
      updateDashboard();
    };

    window.selectDevice = function(deviceId) {
      selectedDevice = parseInt(deviceId);
      updateDashboard();
    };
    
    window.addDevice = function(event) {
      event.preventDefault();
      const name = document.getElementById('device-name').value;
      const type = document.getElementById('device-type').value;
      const location = document.getElementById('device-location').value;
      
      if (name && type && location) {
        devices.push({
          id: Date.now(),
          name,
          type,
          location,
          serial: `HY-RPI-${String(devices.length + 3).padStart(3, '0')}`,
          firmware: '1.2.0',
          profile: 'default',
          status: 'online',
          lastSeen: new Date(),
          createdAt: new Date()
        });
        updateDashboard();
        // Clear form
        document.getElementById('device-name').value = '';
        document.getElementById('device-type').value = '';
        document.getElementById('device-location').value = '';
      }
    };
    
    window.addProfile = function(event) {
      event.preventDefault();
      const name = document.getElementById('profile-name').value;
      const description = document.getElementById('profile-description').value;
      const settings = document.getElementById('profile-settings').value;
      
      if (name && description) {
        profiles.push({
          id: Date.now(),
          name,
          description,
          settings,
          createdAt: new Date()
        });
        updateDashboard();
        // Clear form
        document.getElementById('profile-name').value = '';
        document.getElementById('profile-description').value = '';
        document.getElementById('profile-settings').value = '';
      }
    };
    
    window.exportToCSV = function() {
      const csvData = [];
      const currentData = getCurrentSensorData();
      const headers = ['Timestamp', ...Object.keys(currentData)];
      csvData.push(headers.join(','));

      // Add current data as sample
      const currentRow = [new Date().toISOString(), ...Object.values(currentData)];
      csvData.push(currentRow.join(','));
      
      const csvContent = csvData.join('\n');
      const blob = new Blob([csvContent], { type: 'text/csv' });
      const url = window.URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `hydroponic-data-${getSelectedDevice()?.name}-${new Date().toISOString().split('T')[0]}.csv`;
      a.click();
      window.URL.revokeObjectURL(url);
    };
    
    function startDataUpdates() {
      // Update every 10 seconds instead of 3 seconds
      setInterval(simulateDataUpdate, 10000);
    }
    
    function simulateDataUpdate() {
      const timestamp = new Date();
      
      // Update sensor data for each device with different variations
      Object.keys(deviceSensorData).forEach(deviceId => {
        const data = deviceSensorData[deviceId];
        
        // Store historical data for this device
        if (!historicalData[deviceId]) {
          historicalData[deviceId] = {};
          Object.keys(data).forEach(sensor => {
            historicalData[deviceId][sensor] = [];
          });
        }
        
        Object.keys(data).forEach(sensor => {
          if (!historicalData[deviceId][sensor]) historicalData[deviceId][sensor] = [];
          historicalData[deviceId][sensor].push({
            timestamp,
            value: data[sensor]
          });
          // Keep only last 100 data points
          if (historicalData[deviceId][sensor].length > 100) {
            historicalData[deviceId][sensor] = historicalData[deviceId][sensor].slice(-100);
          }
        });
        
        // Apply different variation patterns for different devices
        const isFirstDevice = deviceId == 1;
        const variationMultiplier = isFirstDevice ? 1 : 1.2; // Second device has more variation
        
        deviceSensorData[deviceId] = {
          temperature: Math.max(18, Math.min(28, data.temperature + (Math.random() - 0.5) * 0.5 * variationMultiplier)),
          humidity: Math.max(50, Math.min(80, data.humidity + (Math.random() - 0.5) * 2 * variationMultiplier)),
          electricConductivity: Math.max(800, Math.min(1600, data.electricConductivity + (Math.random() - 0.5) * 50 * variationMultiplier)),
          waterLevel: Math.max(20, Math.min(100, data.waterLevel + (Math.random() - 0.5) * 3 * variationMultiplier)),
          pH: Math.max(5.5, Math.min(7.5, data.pH + (Math.random() - 0.5) * 0.1 * variationMultiplier)),
          lightIntensity: Math.max(40, Math.min(100, data.lightIntensity + (Math.random() - 0.5) * 5 * variationMultiplier)),
          nutrientLevel: Math.max(50, Math.min(100, data.nutrientLevel + (Math.random() - 0.5) * 2 * variationMultiplier)),
          airTemperature: Math.max(20, Math.min(30, data.airTemperature + (Math.random() - 0.5) * 0.3 * variationMultiplier))
        };
      });
      
      // Only update dashboard if we're on the dashboard tab
      if (activeTab === 'dashboard') {
        updateDashboard();
      }
      
      // Always update the time and username
      const timeElement = document.getElementById('fallback-time');
      const usernameElement = document.getElementById('fallback-username');
      if (timeElement) {
        timeElement.textContent = `Last updated: ${new Date().toLocaleTimeString()}`;
      }
      if (usernameElement) {
        usernameElement.textContent = currentUsername;
      }
    }
  </script>
</body>
</html>
